<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitness Planet | Authentication</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&family=Plus+Jakarta+Sans:wght@400;500;700&display=swap"
        rel="stylesheet">

    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/signin.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="icon" href="pictures/Fitness.png" type="image/x-icon">
</head>

<body>
    <video autoplay loop muted src="pictures/bg_video.mp4"></video>

    <!-- Header Navigation Container -->
    <div id="navbar"></div>

    <main class="page-wrapper">
        <div class="container glass-card">
            <div class="form-box login">
                <form action="#">
                    <h1 class="login">Welcome Back</h1>
                    <p class="auth-sub">Sign in to track workouts and access your account.</p>

                    <div class="input-box">
                        <input type="text" placeholder="Username" required>
                        <i class='bx bxs-user'></i>
                    </div>
                    <div class="input-box">
                        <input type="password" class="password-input" placeholder="Password" required>
                        <i class='bx bxs-lock-alt icon-lock'></i>
                        <i class='bx bx-show toggle-password' title="Toggle Password Visibility"></i>
                    </div>
                    <div class="forgot-link">
                        <a href="#">Forgot Password?</a>
                    </div>
                    <button type="submit" class="btn btn-primary auth-submit">Login</button>
                </form>
            </div>

            <div class="form-box register">
                <form action="#" id="email-form">
                    <h1 class="login">Create Account</h1>
                    <p class="auth-sub">Join Fitness Planet to start your transformation.</p>

                    <div class="input-box">
                        <input type="text" placeholder="Username" required>
                        <i class='bx bxs-user'></i>
                    </div>
                    <div class="input-box">
                        <input type="email" id="user_email" name="user_email" placeholder="Email Address" required>
                        <i class='bx bxs-envelope'></i>
                    </div>
                    <div class="input-box">
                        <input type="password" class="password-input" placeholder="Password" required>
                        <i class='bx bxs-lock-alt icon-lock'></i>
                        <i class='bx bx-show toggle-password' title="Toggle Password Visibility"></i>
                    </div>
                    <button type="submit" class="btn btn-primary auth-submit">Register</button>
                </form>
            </div>

            <div class="toggle-box">
                <div class="toggle-panel toggle-left">
                    <h1>Hello Welcome!</h1>
                    <p>Don't have an account yet?</p>
                    <button class="btn btn-outline register-btn">Register Here</button>
                </div>
                <div class="toggle-panel toggle-right">
                    <h1>Welcome Back!</h1>
                    <p>Already have an account?</p>
                    <button class="btn btn-outline login-btn">Login Here</button>
                </div>
            </div>
        </div>
    </main>

    <script>
        fetch('navbar.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('navbar').innerHTML = data;
                if (typeof initializeChatbot === 'function') {
                    initializeChatbot();
                }
                if (typeof highlightActiveNavLink === 'function') {
                    highlightActiveNavLink();
                }
            });
    </script>
    <script src="js/navbar.js"></script>
    <script src="js/chatbot.js"></script>
    <script src="js/signin.js"></script>
</body>

</html>
